<script>
    const API_BASE = window.location.origin;

    // Runtime-only fallback storage (cleared on page refresh)
    let runtimeRecords = [];

    async function loadRecords() {
        const container = document.getElementById('recordsContainer');
        container.innerHTML = '<div class="loading">Loading records...</div>';

        try {
            const response = await fetch(`${API_BASE}/api/records`);

            if (!response.ok) {
                throw new Error('Failed to fetch records');
            }

            const dbRecords = await response.json();

            // Merge DB records + runtime fallback records
            const records = [...dbRecords, ...runtimeRecords];

            renderRecords(records);

        } catch (error) {
            // If DB fails, still show runtime records
            if (runtimeRecords.length > 0) {
                renderRecords(runtimeRecords);
            } else {
                container.innerHTML = '<div class="empty">No records available.</div>';
            }

            console.error('Error:', error);
        }
    }

    function renderRecords(records) {
        const container = document.getElementById('recordsContainer');

        if (!records || records.length === 0) {
            container.innerHTML = '<div class="empty">No records yet. Add your first record above!</div>';
            return;
        }

        const list = document.createElement('ul');
        list.className = 'records-list';

        records.forEach(record => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="record-name">${escapeHtml(record.name)}</div>
                <div class="record-email">${escapeHtml(record.email)}</div>
            `;
            list.appendChild(li);
        });

        container.innerHTML = '';
        container.appendChild(list);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function addRecord(name, email) {
        const response = await fetch(`${API_BASE}/api/records`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ name, email }),
        });

        return response;
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const messageDiv = document.getElementById('addMessage');

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();

        if (!name || !email) {
            messageDiv.innerHTML = '<div class="error">Please fill in both name and email.</div>';
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            messageDiv.innerHTML = '<div class="error">Please enter a valid email address.</div>';
            return;
        }

        messageDiv.innerHTML = '<div class="loading">Adding record...</div>';

        try {
            const response = await addRecord(name, email);

            if (response.ok) {
                messageDiv.innerHTML = '<div class="success">Record added successfully!</div>';
            } else {
                throw new Error('DB insert failed');
            }

        } catch (error) {
            // FALLBACK: add record only in runtime memory
            runtimeRecords.unshift({
                name,
                email
            });

            renderRecords(runtimeRecords);

            messageDiv.innerHTML =
                '<div class="success">Record added (runtime fallback - not saved permanently).</div>';

            console.error('DB Error, using runtime fallback:', error);
        }

        nameInput.value = '';
        emailInput.value = '';

        loadRecords();

        setTimeout(() => {
            messageDiv.innerHTML = '';
        }, 3000);
    });

    loadRecords();
</script>
